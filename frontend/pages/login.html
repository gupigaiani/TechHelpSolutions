<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TechHelp Solutions</title>
  <link rel="stylesheet" href="../styles/common.css">
  <link rel="stylesheet" href="../styles/pages/login.css">
</head>
<body class="app-body app-body--centered">
  <main class="auth-shell">
    <section class="surface-card auth-card">
      <header class="auth-card__header">
        <h1 class="auth-card__title">TechHelp Solutions</h1>
        <p class="auth-card__subtitle">Sistema de Gerenciamento de Chamados</p>
      </header>

      <form id="login-form" class="form-stack">
        <div class="field">
          <label for="email" class="field__label">E-mail</label>
          <div class="field__control">
            <div class="field__icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
              </svg>
            </div>
            <input id="email" name="email" type="email" required class="field__input field__input--with-icon" placeholder="seu@email.com">
          </div>
        </div>

        <div class="field">
          <label for="password" class="field__label">Senha</label>
          <div class="field__control">
            <div class="field__icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <rect width="18" height="11" x="3" y="11" rx="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </div>
            <input id="password" name="password" type="password" required class="field__input field__input--with-icon" placeholder="********">
          </div>
        </div>

        <button id="login-submit" type="submit" class="button button--primary button--block auth-submit">
          Entrar
        </button>

        <p id="login-message" class="form-message hidden"></p>
      </form>

      <div class="auth-card__footer">
        <p>
          Não tem uma conta?
          <a href="./cadastro.html" class="auth-link">Cadastre-se</a>
        </p>
      </div>
    </section>
  </main>
  <script src="../scripts/app.js"></script>
  <script src="../scripts/pages/login.js"></script>
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget("https://vlibras.gov.br/app");
  </script>
</body>
</html>
