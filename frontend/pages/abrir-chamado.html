<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chamado - TechHelp</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <a id="header-home-link" href="./home-usuario.html" class="text-xl font-bold text-blue-600">
          TechHelp Solutions
        </a>

        <div class="flex items-center space-x-4">
          <div class="flex items-center space-x-2">
            <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-white text-sm font-medium" data-user-initials>
              TH
            </div>
            <span class="text-sm text-gray-700" data-user-name>Usuario</span>
          </div>

          <button data-logout class="flex items-center space-x-1 px-3 py-2 text-sm text-gray-700 hover:text-red-600 hover:bg-gray-100 rounded-md">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m16 17 5-5-5-5"></path>
              <path d="M21 12H9"></path>
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            </svg>
            <span>Sair</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="max-w-2xl mx-auto">
      <button id="back-button" class="flex items-center space-x-2 text-gray-600 hover:text-gray-900 mb-6">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path d="m12 19-7-7 7-7"></path>
          <path d="M19 12H5"></path>
        </svg>
        <span>Voltar</span>
      </button>

      <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8">
        <h1 id="page-title" class="text-2xl font-bold text-gray-900 mb-6">Abrir Chamado</h1>

        <form id="ticket-form" class="space-y-6">
          <div>
            <label for="title" class="block text-sm font-medium text-gray-700 mb-2">Titulo *</label>
            <input id="title" type="text" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Digite o titulo do chamado">
          </div>

          <div>
            <label for="category" class="block text-sm font-medium text-gray-700 mb-2">Categoria *</label>
            <select id="category" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="">Carregando categorias...</option>
            </select>
          </div>

          <div>
            <label for="priority" class="block text-sm font-medium text-gray-700 mb-2">Prioridade *</label>
            <select id="priority" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="">Carregando prioridades...</option>
            </select>
          </div>

          <div>
            <label for="description" class="block text-sm font-medium text-gray-700 mb-2">Descricao *</label>
            <textarea id="description" rows="6" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none resize-none" placeholder="Descreva o problema em detalhes..."></textarea>
          </div>

          <p id="form-message" class="hidden text-sm rounded-md px-3 py-2"></p>

          <div class="flex space-x-4">
            <button id="cancel-button" type="button" class="flex-1 px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50">
              Cancelar
            </button>

            <button id="submit-button" type="submit" class="flex-1 flex items-center justify-center space-x-2 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"></path>
                <path d="m21.854 2.147-10.94 10.939"></path>
              </svg>
              <span id="submit-label">Enviar</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="./scripts/app.js"></script>
  <script>
    const app = window.TechHelpApp;
    const form = document.getElementById("ticket-form");
    const categorySelect = document.getElementById("category");
    const prioritySelect = document.getElementById("priority");
    const submitButton = document.getElementById("submit-button");
    const submitLabel = document.getElementById("submit-label");
    const cancelButton = document.getElementById("cancel-button");
    const backButton = document.getElementById("back-button");
    const formMessage = document.getElementById("form-message");
    const pageTitle = document.getElementById("page-title");
    const headerHomeLink = document.getElementById("header-home-link");
    const ticketId = new URLSearchParams(window.location.search).get("id");

    let currentUser = null;

    function getHomePath() {
      return currentUser?.role === "Tecnico" ? "./home-tecnico.html" : "./home-usuario.html";
    }

    function goBackHome() {
      window.location.href = getHomePath();
    }

    function showMessage(text, type) {
      formMessage.textContent = text;
      formMessage.className = "text-sm rounded-md px-3 py-2";
      if (type === "error") {
        formMessage.classList.add("bg-red-50", "text-red-700", "border", "border-red-200");
      } else {
        formMessage.classList.add("bg-green-50", "text-green-700", "border", "border-green-200");
      }
    }

    function fillSelect(select, items, placeholder) {
      if (!items.length) {
        select.innerHTML = `<option value="">${placeholder}</option>`;
        select.disabled = true;
        return;
      }

      select.disabled = false;
      select.innerHTML = `
        <option value="">Selecione</option>
        ${items.map((item) => `<option value="${item.id}">${item.nome}</option>`).join("")}
      `;
    }

    async function loadCatalogs() {
      const [categoriesResponse, prioritiesResponse] = await Promise.all([
        app.apiFetch("/api/catalogos/categorias"),
        app.apiFetch("/api/catalogos/prioridades")
      ]);

      const categories = await app.readResponse(categoriesResponse);
      const priorities = await app.readResponse(prioritiesResponse);

      if (!categoriesResponse.ok || !prioritiesResponse.ok) {
        throw new Error("Nao foi possivel carregar as opcoes do formulario.");
      }

      fillSelect(categorySelect, Array.isArray(categories) ? categories : [], "Nenhuma categoria disponivel");
      fillSelect(prioritySelect, Array.isArray(priorities) ? priorities : [], "Nenhuma prioridade disponivel");
    }

    async function loadTicketForEdit(id) {
      const response = await app.apiFetch(`/api/chamados/${id}`);
      const data = await app.readResponse(response);

      if (!response.ok || !data) {
        throw new Error(typeof data === "string" ? data : "Nao foi possivel carregar o chamado para edicao.");
      }

      document.getElementById("title").value = data.titulo || "";
      document.getElementById("description").value = data.descricao || "";
      categorySelect.value = String(data.categoriaId || "");
      prioritySelect.value = String(data.prioridadeId || "");
    }

    backButton.addEventListener("click", goBackHome);
    cancelButton.addEventListener("click", goBackHome);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      formMessage.className = "hidden";
      submitButton.disabled = true;
      submitLabel.textContent = ticketId ? "Salvando..." : "Enviando...";

      try {
        const payload = {
          titulo: document.getElementById("title").value.trim(),
          descricao: document.getElementById("description").value.trim(),
          categoriaId: Number(categorySelect.value),
          prioridadeId: Number(prioritySelect.value)
        };

        const response = await app.apiFetch(ticketId ? `/api/chamados/${ticketId}` : "/api/chamados", {
          method: ticketId ? "PUT" : "POST",
          body: JSON.stringify(payload)
        });

        const data = await app.readResponse(response);
        if (!response.ok) {
          throw new Error(typeof data === "string" ? data : (ticketId ? "Nao foi possivel atualizar o chamado." : "Nao foi possivel abrir o chamado."));
        }

        showMessage(ticketId ? "Chamado atualizado com sucesso. Redirecionando..." : "Chamado aberto com sucesso. Redirecionando...", "success");
        setTimeout(goBackHome, 1200);
      } catch (error) {
        showMessage(error.message || (ticketId ? "Erro ao atualizar chamado." : "Erro ao abrir chamado."), "error");
      } finally {
        submitButton.disabled = false;
        submitLabel.textContent = ticketId ? "Salvar alteracoes" : "Enviar";
      }
    });

    (async () => {
      const user = await app.requireAuth(["Usuario", "Tecnico"]);
      if (!user) {
        return;
      }

      currentUser = user;
      headerHomeLink.href = getHomePath();
      app.attachLogout();

      try {
        await loadCatalogs();

        if (!ticketId && user.role !== "Usuario") {
          pageTitle.textContent = "Abrir Chamado";
          showMessage("Somente usuarios podem abrir novos chamados.", "error");
          submitButton.disabled = true;
          return;
        }

        if (ticketId) {
          pageTitle.textContent = "Editar Chamado";
          submitLabel.textContent = "Salvar alteracoes";
          await loadTicketForEdit(ticketId);
        }
      } catch (error) {
        showMessage(error.message || "Erro ao carregar o formulario.", "error");
      }
    })();
  </script>
</body>
</html>
