<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chamado - TechHelp</title>
  <link rel="stylesheet" href="../styles/common.css">
  <link rel="stylesheet" href="../styles/pages/abrir-chamado.css">
</head>
<body class="app-body">
  <header class="topbar">
    <div class="topbar__inner">
      <a id="header-home-link" href="./home-usuario.html" class="brand-link">TechHelp Solutions</a>

      <div class="topbar__actions">
        <div class="user-chip">
          <div class="user-chip__avatar" data-user-initials>TH</div>
          <span class="user-chip__name" data-user-name>Usuario</span>
        </div>

        <button data-logout class="button button--danger-text">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m16 17 5-5-5-5"></path>
            <path d="M21 12H9"></path>
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          </svg>
          <span>Sair</span>
        </button>
      </div>
    </div>
  </header>

  <main class="page-shell page-shell--sm">
    <div class="ticket-editor">
      <button id="back-button" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path d="m12 19-7-7 7-7"></path>
          <path d="M19 12H5"></path>
        </svg>
        <span>Voltar</span>
      </button>

      <section class="surface-card ticket-editor__card">
        <h1 id="page-title" class="section-heading__title">Abrir Chamado</h1>

        <form id="ticket-form" class="form-stack">
          <div class="field">
            <label for="title" class="field__label">Título *</label>
            <input id="title" type="text" required class="field__input" placeholder="Digite o titulo do chamado">
          </div>

          <div class="field">
            <label for="category" class="field__label">Categoria *</label>
            <select id="category" required class="field__select">
              <option value="">Carregando categorias...</option>
            </select>
          </div>

          <div class="field">
            <label for="priority" class="field__label">Prioridade *</label>
            <select id="priority" required class="field__select">
              <option value="">Carregando prioridades...</option>
            </select>
          </div>

          <div class="field">
            <label for="description" class="field__label">Descrição *</label>
            <textarea id="description" rows="6" required class="field__textarea field__textarea--fixed" placeholder="Descreva o problema em detalhes..."></textarea>
          </div>

          <p id="form-message" class="form-message hidden"></p>

          <div class="ticket-editor__actions">
            <button id="cancel-button" type="button" class="button button--ghost">Cancelar</button>

            <button id="submit-button" type="submit" class="button button--primary">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"></path>
                <path d="m21.854 2.147-10.94 10.939"></path>
              </svg>
              <span id="submit-label">Enviar</span>
            </button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script src="../scripts/app.js"></script>
  <script src="../scripts/pages/abrir-chamado.js"></script>
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget("https://vlibras.gov.br/app");
  </script>
</body>
</html>
