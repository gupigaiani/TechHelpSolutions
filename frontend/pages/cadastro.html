<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - TechHelp</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100 flex items-center justify-center px-4">
  <div class="max-w-md w-full">
    <div class="bg-white rounded-lg shadow-lg p-8">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-blue-600 mb-2">TechHelp Solutions</h1>
        <p class="text-gray-600">Criar Nova Conta</p>
      </div>

      <form id="register-form" class="space-y-5">
        <div>
          <label for="nome" class="block text-sm font-medium text-gray-700 mb-2">Nome Completo</label>
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-gray-400">👤</span>
            <input id="nome" name="nome" type="text" required placeholder="Seu nome completo" class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">E-mail</label>
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-gray-400">📧</span>
            <input id="email" name="email" type="email" required placeholder="seu@email.com" class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label for="tipo" class="block text-sm font-medium text-gray-700 mb-2">Tipo de Usuário</label>
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-gray-400">👥</span>
            <select id="tipo" name="tipo" required class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="">Selecione o tipo</option>
              <option value="Usuario">Usuário</option>
              <option value="Tecnico">Técnico</option>
              <option value="Gestor">Gestor</option>
            </select>
          </div>
        </div>

        <div>
          <label for="senha" class="block text-sm font-medium text-gray-700 mb-2">Senha</label>
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-gray-400">🔒</span>
            <input id="senha" name="senha" type="password" required minlength="4" placeholder="********" class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label for="confirmar-senha" class="block text-sm font-medium text-gray-700 mb-2">Confirmar Senha</label>
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-gray-400">🔒</span>
            <input id="confirmar-senha" name="confirmar-senha" type="password" required minlength="4" placeholder="********" class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>

        <button id="register-submit" type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition">
          Cadastrar
        </button>

        <p id="register-message" class="hidden text-sm rounded-md px-3 py-2"></p>
      </form>

      <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">
          Já tem uma conta?
          <a href="./login.html" class="text-blue-600 hover:text-blue-700 font-medium">Faça login</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = "http://localhost:5266";

    const form = document.getElementById("register-form");
    const submitButton = document.getElementById("register-submit");
    const message = document.getElementById("register-message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "text-sm rounded-md px-3 py-2";
      if (type === "error") {
        message.classList.add("bg-red-50", "text-red-700", "border", "border-red-200");
      } else {
        message.classList.add("bg-green-50", "text-green-700", "border", "border-green-200");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.className = "hidden";

      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const tipo = document.getElementById("tipo").value;
      const senha = document.getElementById("senha").value;
      const confirmarSenha = document.getElementById("confirmar-senha").value;

      if (senha !== confirmarSenha) {
        showMessage("As senhas não conferem.", "error");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Cadastrando...";

      try {
        const response = await fetch(`${API_BASE_URL}/api/usuarios`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ nome, email, senha, tipo })
        });

        const rawText = await response.text();

        if (!response.ok) {
          throw new Error(rawText || "Não foi possível concluir o cadastro.");
        }

        showMessage("Cadastro realizado com sucesso. Você será redirecionado para o login.", "success");
        form.reset();

        setTimeout(() => {
          window.location.href = "./login.html";
        }, 1500);
      } catch (error) {
        showMessage(error.message || "Erro ao cadastrar usuário.", "error");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Cadastrar";
      }
    });
  </script>
</body>
</html>
