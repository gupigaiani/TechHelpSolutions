<!DOCTYPE html>

            <select id="tipo" name="tipo" required class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">

          </div>
        </div>

        <button id="register-submit" type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition">
