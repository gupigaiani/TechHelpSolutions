<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Tecnico</title>
  <link rel="stylesheet" href="../styles/common.css">
  <link rel="stylesheet" href="../styles/pages/home-tecnico.css">
</head>
<body class="app-body">
  <header class="topbar">
    <div class="topbar__inner">
      <div class="topbar__brand">
        <a href="./home-tecnico.html" class="brand-link">TechHelp Solutions</a>
      </div>

      <div class="topbar__actions">
        <div class="user-chip">
          <div class="user-chip__avatar" data-user-initials>NT</div>
          <span class="user-chip__name" data-user-name>Nome Tecnico</span>
        </div>

        <button data-logout class="button button--danger-text">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m16 17 5-5-5-5"></path>
            <path d="M21 12H9"></path>
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          </svg>
          <span>Sair</span>
        </button>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <div class="tech-dashboard">
      <section class="section-heading">
        <h1 class="section-heading__title">Dashboard do Técnico</h1>
      </section>

      <section class="surface-card tech-filter-card">
        <div class="tech-filter-card__header">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 20a1 1 0 0 0 .553.895l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .517-1.341L21.74 4.67A1 1 0 0 0 21 3H3a1 1 0 0 0-.742 1.67l7.225 7.989A2 2 0 0 1 10 14z" />
          </svg>
          <span>Filtros</span>
        </div>
        <div class="tech-filter-grid">
          <div class="field">
            <label for="priority-filter" class="field__label">Prioridade</label>
            <select id="priority-filter" class="field__select">
              <option value="">Todas</option>
            </select>
          </div>

          <div class="field">
            <label for="status-filter" class="field__label">Status</label>
            <select id="status-filter" class="field__select">
              <option value="">Todos</option>
            </select>
          </div>
        </div>
      </section>

      <section class="list-panel">
        <div class="list-panel__header">
          <h2>Chamados</h2>
          <span id="tech-total" class="section-heading__subtitle">0 itens</span>
        </div>

        <div id="tech-message" class="list-panel__message">Carregando chamados...</div>
        <div id="tech-ticket-list" class="list-panel__content tech-ticket-list hidden"></div>
      </section>
    </div>
  </main>

  <script src="../scripts/app.js"></script>
  <script src="../scripts/pages/home-tecnico.js"></script>
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget("https://vlibras.gov.br/app");
  </script>
</body>
</html>
