<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - TechHelp</title>
  <link rel="stylesheet" href="../styles/common.css">
  <link rel="stylesheet" href="../styles/pages/home-usuario.css">
</head>
<body class="app-body">
  <header class="topbar">
    <div class="topbar__inner">
      <a href="./home-usuario.html" class="brand-link">TechHelp Solutions</a>

      <div class="topbar__actions">
        <div class="user-chip">
          <div class="user-chip__avatar" data-user-initials>TH</div>
          <span class="user-chip__name" data-user-name>Usuario</span>
        </div>

        <button data-logout class="button button--danger-text">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m16 17 5-5-5-5"></path>
            <path d="M21 12H9"></path>
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          </svg>
          <span>Sair</span>
        </button>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <div class="user-dashboard">
      <section class="user-dashboard__hero">
        <div class="section-heading user-dashboard__title-block">
          <h1 class="section-heading__title">Meus Chamados</h1>
          <p class="section-heading__subtitle">Acompanhe seus chamados abertos e o andamento de cada um.</p>
        </div>

        <a href="./abrir-chamado.html" id="open-ticket-link" class="button button--primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14"></path>
            <path d="M12 5v14"></path>
          </svg>
          <span>Abrir Chamado</span>
        </a>
      </section>

      <section class="list-panel">
        <div class="list-panel__header">
          <h2>Histórico de Chamados</h2>
          <span id="tickets-total" class="section-heading__subtitle">0 itens</span>
        </div>

        <div id="tickets-message" class="list-panel__message">Carregando chamados...</div>
        <div id="tickets-list" class="list-panel__content ticket-list hidden"></div>
      </section>

      <section class="stats-grid">
        <article class="stat-card">
          <div class="stat-card__header">
            <div class="stat-card__icon stat-card__icon--warning">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" x2="12" y1="8" y2="12" />
                <line x1="12" x2="12.01" y1="16" y2="16" />
              </svg>
            </div>
            <p id="count-open" class="stat-card__value">0</p>
          </div>
          <p class="stat-card__label">Abertos</p>
        </article>

        <article class="stat-card">
          <div class="stat-card__header">
            <div class="stat-card__icon stat-card__icon--primary">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 6v6l4 2" />
              </svg>
            </div>
            <p id="count-progress" class="stat-card__value">0</p>
          </div>
          <p class="stat-card__label">Em andamento</p>
        </article>

        <article class="stat-card">
          <div class="stat-card__header">
            <div class="stat-card__icon stat-card__icon--success">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <path d="m9 12 2 2 4-4" />
              </svg>
            </div>
            <p id="count-closed" class="stat-card__value">0</p>
          </div>
          <p class="stat-card__label">Finalizados</p>
        </article>
      </section>
    </div>
  </main>

  <script src="../scripts/app.js"></script>
  <script src="../scripts/pages/home-usuario.js"></script>
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget("https://vlibras.gov.br/app");
  </script>
</body>
</html>
